# Logical LaboVR actions bind to profile-independent physical controls.
bind.navigation.move.left=thumbstick
bind.navigation.move.left.deadzone=0.18
bind.navigation.turn.right=thumbstick
bind.navigation.turn.right.deadzone=0.18
# Quest: B raises / A lowers the common tracking rig.
bind.navigation.height_up.right=secondary_click
bind.navigation.height_down.right=primary_click
bind.navigation.recenter.left=thumbstick_click

bind.interaction.grab.left=squeeze
bind.interaction.grab.right=squeeze
bind.interaction.grab.left.press=0.65
bind.interaction.grab.left.release=0.25
bind.interaction.grab.right.press=0.65
bind.interaction.grab.right.release=0.25

bind.interaction.primary.left=trigger_value
bind.interaction.primary.right=trigger_value
bind.interaction.primary.left.press=0.75
bind.interaction.primary.left.release=0.30
bind.interaction.primary.right.press=0.75
bind.interaction.primary.right.release=0.30
bind.interaction.secondary.left=trigger_force
bind.interaction.secondary.right=trigger_force
bind.interaction.touch.left=trigger_touch
bind.interaction.touch.right=trigger_touch
bind.interaction.physical.left=trigger_touch | primary_touch | secondary_touch | thumbstick_touch | thumbrest_touch
bind.interaction.physical.right=trigger_touch | primary_touch | secondary_touch | thumbstick_touch | thumbrest_touch
bind.interaction.proximity.left=trigger_proximity
bind.interaction.proximity.right=trigger_proximity
bind.interaction.mode.left=primary_click
bind.interaction.next.left=secondary_click

bind.tracking.hand_pose.left=grip_pose
bind.tracking.hand_pose.right=grip_pose
bind.tracking.aim_pose.left=aim_pose
bind.tracking.aim_pose.right=aim_pose
bind.interaction.feedback.left=haptic
bind.interaction.feedback.right=haptic

# Experience semantics only.
lab.locomotion_reference=head
lab.speed=1.35
lab.yaw_speed=1.35
lab.height_speed=0.55
lab.height_min=-1.25
lab.height_max=1.25

bind.system.menu.left=menu_click

home.hand_position_tau=0.018
home.hand_rotation_tau=0.024
home.hand_max_speed=7.0
home.hand_max_angular_speed=20.0
home.grab_radius=0.10
home.grab_stiffness=250.0
home.grab_damping=5.0
home.grab_max_force=12.0
